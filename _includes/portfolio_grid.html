<!-- Portfolio Grid Section -->
<section id="about">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Who We Are</h2>
        <hr class="star-primary">
      </div>
    </div>
    <div class="portfolio-flex-row">
      {% for post in site.posts %}
      <div class="portfolio-flex-item portfolio-item">
        <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
          <div class="portfolio-link" data-toggle="modal">
            <div class="caption">
              <div class="caption-content text-center">
                <h3 style="font-size: 2rem">{{ post.alt }}</h3>
              </div>
            </div>
            <img src="img/portfolio/{{ post.img }}" class="center-block img-responsive" alt="{{ post.alt }}">
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="col-lg-12 col-lg-offset">
      <img class="img-center" width="200" height="200" src="assets/images/special-education-thumbnail.png" alt="Text: All Things Special Ed">
        <style>.img-center { margin: 0 auto; display: block; }</style>
      </img>
  </div>
</section>
